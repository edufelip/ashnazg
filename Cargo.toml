[package]
name = "ashnazg"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Authenticated host and MCP control server for Ashnazg Android agent"
license = "MIT"

[lib]
name = "ashnazg"
path = "src/lib.rs"

[[test]]
name = "contract"
path = "rust-tests/contract.rs"

[[bin]]
name = "ashnazg"
path = "src/main.rs"

[dependencies]
anyhow = "1"
rawzip = { version = "=0.5.2", default-features = false, features = ["std"] }
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
libc = "0.2"
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
base64 = "0.22"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive", "env"] }
rmcp = { version = "3.10", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "http2"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "=0.4.46"
xz2 = "=0.1.7"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
thiserror = "2"
zeroize = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
