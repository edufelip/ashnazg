pluginManagement {
    includeBuild("reactnative/node_modules/@react-native/gradle-plugin")
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id("com.facebook.react.settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { extension ->
    extension.autolinkLibrariesFromCommand(
        ["npx", "@react-native-community/cli", "config"],
        file("reactnative"),
    )
}

rootProject.name = "ashnazg-framework-fixtures"
include(":compose", ":reactnative")
includeBuild("reactnative/node_modules/@react-native/gradle-plugin")
