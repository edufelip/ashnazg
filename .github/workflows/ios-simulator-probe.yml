name: iOS Simulator control probe

on:
  pull_request:
    paths:
      - platform/ios/**
      - src/ios_fixture.rs
      - src/lib.rs
      - src/main.rs
      - src/mcp.rs
      - Cargo.toml
      - Cargo.lock
      - runtime/mcp-tools.schema.json
      - .github/workflows/ios-simulator-probe.yml
  workflow_dispatch:
    inputs:
      apple_mcp_inventory:
        description: Record Apple MCP admission and tools on an isolated Xcode 27 runner
        type: boolean
        default: false
      apple_mcp_unattended:
        description: Test Apple’s unattended approval mode on a disposable public runner
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apple-mcp-inventory:
    if: github.event_name == 'workflow_dispatch' && inputs.apple_mcp_inventory
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install xcodegen
      - name: Probe Apple MCP with no open workspace
        env:
          APPLE_MCP_UNATTENDED: ${{ inputs.apple_mcp_unattended }}
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          output="$RUNNER_TEMP/ashnazg-apple-mcp"
          mkdir -p "$output"
          sw_vers > "$output/macos.txt"
          xcodebuild -version > "$output/xcode.txt"
          if pgrep -x Xcode > "$output/open-xcode-pids.txt"; then
            echo "Unexpected Xcode desktop session on isolated runner" >&2
            exit 1
          fi
          xcrun mcp-server status > "$output/status-before.txt" 2>&1 || true
          python3 -m scripts.xcode_mcp_inventory --output "$output/stock.json"
          if sudo -n xcrun mcp-server enable > "$output/enable.txt" 2>&1; then
            simulator=
            cleanup() {
              local result=$?
              trap - EXIT
              if [[ -n "$simulator" ]]; then
                xcrun simctl shutdown "$simulator" >/dev/null 2>&1 || true
                xcrun simctl delete "$simulator" > "$output/simulator-delete.txt" 2>&1 || result=1
                xcrun simctl list -j devices > "$RUNNER_TEMP/ashnazg-ios-cleanup.json" || result=1
                jq -e --arg id "$simulator" 'all(.devices[][]; .udid != $id)' \
                  "$RUNNER_TEMP/ashnazg-ios-cleanup.json" > "$output/simulator-absent.txt" || result=1
              fi
              sudo -n xcrun mcp-server disable > "$output/disable.txt" 2>&1 || result=1
              exit "$result"
            }
            trap cleanup EXIT
            trap 'exit 130' INT
            trap 'exit 143' TERM
            xcrun mcp-server status > "$output/status-enabled.txt" 2>&1 || true
            python3 -m scripts.xcode_mcp_inventory --output "$output/headless.json"
            xcrun simctl list -j runtimes > "$output/runtimes.json"
            device_type=com.apple.CoreSimulator.SimDeviceType.iPhone-17
            runtime=$(jq -er --arg device "$device_type" '
              [.runtimes[] | select(.platform == "iOS" and .isAvailable
                and any(.supportedDeviceTypes[]?; .identifier == $device))]
              | sort_by(.version | split(".") | map(tonumber)) | last | .identifier' "$output/runtimes.json")
            printf '%s\n' "$runtime" > "$output/owned-runtime.txt"
            simulator=$(xcrun simctl create "AshnazgAppleMCP-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              "$device_type" "$runtime")
            printf '%s\n' "$simulator" > "$output/owned-simulator.txt"
            xcrun simctl boot "$simulator"
            (cd platform/ios && xcodegen generate)
            derived="$RUNNER_TEMP/ashnazg-apple-fixture-build"
            xcodebuild build -project platform/ios/AshnazgSimulatorProbe.xcodeproj \
              -scheme AshnazgSimulatorProbe -destination "platform=iOS Simulator,id=$simulator" \
              -derivedDataPath "$derived" > "$output/fixture-build.txt" 2>&1
            xcrun simctl bootstatus "$simulator" -b
            xcrun simctl install "$simulator" "$derived/Build/Products/Debug-iphonesimulator/Fixture.app"
            xcrun simctl launch "$simulator" dev.ashnazg.ios.fixture
            if [[ "$APPLE_MCP_UNATTENDED" == true ]]; then
              test "$GITHUB_REPOSITORY" = edufelip/ashnazg
              test "$RUNNER_ENVIRONMENT" = github-hosted
              sudo -n xcrun mcp-server disable > "$output/disable-before-unattended.txt" 2>&1
              sudo -n xcrun mcp-server enable --unsafe-always-allow-all-agents \
                > "$output/enable-unattended.txt" 2>&1
              python3 -m scripts.xcode_mcp_fixture --simulator "$simulator" --output "$output/unattended" --exercise
            else
              python3 -m scripts.xcode_mcp_fixture --simulator "$simulator" --output "$output/fixture"
            fi
          fi
      - name: Upload Apple MCP inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apple-mcp-inventory
          path: ${{ runner.temp }}/ashnazg-apple-mcp
          if-no-files-found: error

  simulator:
    if: github.event_name != 'workflow_dispatch' || !inputs.apple_mcp_inventory
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install xcodegen
      - name: Test semantic input and screenshot capture
        working-directory: platform/ios
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ashnazg-ios-probe"
          output="$RUNNER_TEMP/ashnazg-ios-probe"
          xcodebuild -version | tee "$output/xcode.txt"
          xcodegen --version | tee "$output/xcodegen.txt"
          xcrun simctl list -j runtimes > "$output/runtimes.json"
          runtime=$(jq -er '[.runtimes[] | select(.platform == "iOS" and .isAvailable)]
            | sort_by(.version | split(".") | map(tonumber)) | last | .identifier' "$output/runtimes.json")
          simulator=$(xcrun simctl create "AshnazgProbe-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17 "$runtime")
          cleanup() {
            local result=$?
            trap - EXIT
            xcrun simctl shutdown "$simulator" >/dev/null 2>&1 || true
            xcrun simctl delete "$simulator" || result=1
            exit "$result"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          printf '%s\n' "$simulator" > "$output/owned-simulator.txt"
          xcodegen generate
          xcodebuild test -project AshnazgSimulatorProbe.xcodeproj -scheme AshnazgSimulatorProbe \
            -destination "platform=iOS Simulator,id=$simulator" \
            -parallel-testing-enabled NO -resultBundlePath "$output/Probe.xcresult" 2>&1 | tee "$output/test.log"
      - name: Upload Simulator probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-simulator-probe
          path: ${{ runner.temp }}/ashnazg-ios-probe
          if-no-files-found: warn

  mcp:
    if: github.event_name != 'workflow_dispatch' || !inputs.apple_mcp_inventory
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install xcodegen
      - name: Build the pinned Rust CLI
        run: |
          rustup show active-toolchain
          cargo build --locked
      - name: Exercise the live MCP fixture session
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ashnazg-ios-mcp"
          python3 platform/ios/verify_mcp_fixture.py \
            --binary target/debug/ashnazg \
            --output-dir "$RUNNER_TEMP/ashnazg-ios-mcp/evidence" | tee "$RUNNER_TEMP/ashnazg-ios-mcp/verify.log"
      - name: Upload MCP fixture evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-mcp-fixture
          path: ${{ runner.temp }}/ashnazg-ios-mcp
          if-no-files-found: warn
