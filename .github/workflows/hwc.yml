name: Experimental HWC image qualification

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hwc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Determine HWC qualification scope
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PYTHON'
          import os, re, subprocess, sys

          event, base, head = (os.environ[name] for name in ('EVENT_NAME', 'BASE_SHA', 'HEAD_SHA'))
          pattern = re.compile(r'[0-9a-f]{40}')
          if not pattern.fullmatch(head):
              sys.exit('invalid or unavailable HWC source SHA')
          if subprocess.run(['git', 'cat-file', '-e', f'{head}^{{commit}}'], check=False).returncode:
              sys.exit(f'HWC source commit is unavailable: {head}')

          if event == 'workflow_dispatch':
              required = True
          elif event in ('pull_request', 'push'):
              if not pattern.fullmatch(base):
                  sys.exit('invalid or unavailable HWC comparison base SHA')
              if event == 'push' and set(base) == {'0'}:
                  required = True
              else:
                  if set(base) == {'0'}:
                      sys.exit('invalid or unavailable HWC comparison base SHA')
                  for sha in (base, head):
                      if subprocess.run(['git', 'cat-file', '-e', f'{sha}^{{commit}}'], check=False).returncode:
                          sys.exit(f'HWC comparison commit is unavailable: {sha}')
                  result = subprocess.run(
                      ['git', 'diff', '--name-only', '--no-renames', base, head],
                      check=False, capture_output=True, text=True)
                  if result.returncode:
                      sys.exit('could not determine HWC changed paths')
                  paths = result.stdout.splitlines()
                  exact = {
                      '.github/workflows/hwc.yml', '.github/workflows/quality.yml',
                      'scripts/build_hwc.sh', 'scripts/build_hwc_image.py',
                      'scripts/build_display_probe.sh', 'tests/test_display_probe.py',
                      'scripts/build_android_image.py', 'scripts/redroid_action.sh',
                      'scripts/harness.py', 'scripts/hwc_acceptance.py',
                      'scripts/linux_binder.py', 'scripts/redroid.py',
                      'scripts/integration.py', 'scripts/benchmark.py',
                      'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'build.rs', 'action.yml',
                      'tests/test_hwc_image.py', 'tests/test_hwc_acceptance.py',
                  }
                  required = any(
                      path in exact or path.startswith((
                          'runtime/hwc/', 'runtime/hwc-image/', 'runtime/display-governor/', 'agent-android/',
                          'fixtures/', 'src/', 'build_support/'))
                      for path in paths)
          else:
              sys.exit(f'unsupported HWC scope event: {event}')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'required={str(required).lower()}\n')
          print('HWC qualification required:', required)
          PYTHON
  qualify:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    name: Experimental HWC Linux x64 qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ASHNAZG_BIN: ${{ github.workspace }}/target/release/ashnazg
      ASHNAZG_CI_DIAGNOSTICS: '1'
      ASHNAZG_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record runner and source provenance
        run: |
          mkdir -p artifacts/hwc
          {
            printf 'source_sha=%s\n' "$ASHNAZG_SOURCE_SHA"
            printf 'profile_image=%s\n' 'redroid/redroid@sha256:81889852444606824d33eb0232fa5813bce3f0993afe871785120af0d7c991ad'
            printf 'github_sha=%s\n' "$GITHUB_SHA"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            printf 'runner_image=%s\n' "${ImageOS:-unknown}/${ImageVersion:-unknown}"
            uname -a
            cat /etc/os-release
            docker version
          } > artifacts/hwc/runner-provenance.txt
          python3 -c 'import sys; assert sys.version_info >= (3, 10), sys.version'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: fixtures/reactnative/package-lock.json
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.1.12297006 cmake;3.22.1'
      - name: Run portable HWC recipe tests
        run: python3 -m unittest tests.test_hwc_image -v
      - name: Run host HWC ABI and state tests
        run: |
          cmake -S runtime/hwc -B artifacts/hwc/native -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build artifacts/hwc/native --parallel
          ctest --test-dir artifacts/hwc/native --output-on-failure
      - name: Build and test both Android HWC modules
        run: |
          scripts/build_hwc.sh --output-dir artifacts/hwc/modules
          for abi in arm64-v8a x86_64; do
            file "artifacts/hwc/modules/$abi/hwcomposer.default.so"
          done
          cp runtime/hwc/LICENSES/Apache-2.0.txt runtime/hwc/UPSTREAM.md artifacts/hwc/
      - name: Provision owned Binderfs test fixture
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" python3 scripts/linux_binder.py --output-dir artifacts/hwc
      - name: Install React Native dependencies
        run: npm ci
        working-directory: fixtures/reactnative
      - name: Build host, APKs and framework fixtures
        run: |
          cargo build --release --locked
          python3 scripts/ci_gradle.py --workdir agent-android -- test lint assembleDebug
          python3 scripts/ci_gradle.py --workdir fixtures -- :compose:assembleDebug :reactnative:assembleDebug
      - name: Build the experimental framework display-policy probe
        run: scripts/build_display_probe.sh --output artifacts/hwc/display-probe.jar
      - name: Build local experimental HWC image
        run: |
          git status --porcelain=v1 --untracked-files=all | tee artifacts/hwc/source-status-before-image.txt
          if [[ -s artifacts/hwc/source-status-before-image.txt ]]; then
            echo 'Source checkout changed during build; refusing HWC image qualification' >&2
            exit 1
          fi
          if [[ "$RUNNER_ARCH" == "X64" ]]; then module=artifacts/hwc/modules/x86_64/hwcomposer.default.so; platform=linux/amd64
          else echo "HWC qualification requires an x64 Linux runner" >&2; exit 2; fi
          python3 scripts/build_hwc_image.py \
            --source-sha "$ASHNAZG_SOURCE_SHA" \
            --version 0.2.0 \
            --platform "$platform" \
            --tag ashnazg-redroid:0.2.0 \
            --agent-apk agent-android/agent/build/outputs/apk/debug/agent-debug.apk \
            --fixture-apk agent-android/fixture/build/outputs/apk/debug/fixture-debug.apk \
            --hwc-module "$module" \
            --output artifacts/hwc/provenance.json
      - name: Qualify loaded HWC module in a disposable rooted guest
        uses: ./
        with:
          output-directory: artifacts/hwc/qualifier-guest
          adb-port: '5555'
          boot-timeout: '180'
          image-provenance: artifacts/hwc/provenance.json
          command: |
            set -euo pipefail
            python3 scripts/hwc_acceptance.py --disposable-guest --provenance artifacts/hwc/provenance.json --output artifacts/hwc/qualification.json
      - name: Run integration and benchmark in a fresh guest
        uses: ./
        with:
          output-directory: artifacts/hwc/integration-guest
          # Keep this guest's endpoint separate from the disposed rooted guest.
          adb-port: '5556'
          boot-timeout: '180'
          image-provenance: artifacts/hwc/provenance.json
          command: |
            set -euo pipefail
            python3 scripts/integration.py --preinstalled-agent --framework-fixtures --output artifacts/hwc/integration.json --artifacts artifacts/hwc/integration
            python3 scripts/benchmark.py --iterations 10 --output artifacts/hwc/benchmark.json
      - name: Qualify framework display policy in a separate disposable guest
        uses: ./
        with:
          output-directory: artifacts/hwc/policy-probe-guest
          adb-port: '5557'
          boot-timeout: '180'
          image-provenance: artifacts/hwc/provenance.json
          command: |
            set -euo pipefail
            collect_probe_crash() {
              status=$?
              if (( status != 0 )); then
                set +e
                timeout 10s adb -s "$ANDROID_SERIAL" logcat -b crash -d -t 200 | head -c 32768 > artifacts/hwc/policy-crash-logcat.txt
              fi
              exit "$status"
            }
            trap collect_probe_crash EXIT
            timeout 30s adb -s "$ANDROID_SERIAL" root
            timeout 30s adb -s "$ANDROID_SERIAL" wait-for-device
            test "$(timeout 10s adb -s "$ANDROID_SERIAL" shell id -u | tr -d '\r')" = 0
            timeout 30s adb -s "$ANDROID_SERIAL" push artifacts/hwc/display-probe.jar /data/local/tmp/ashnazg-display-probe.jar
            timeout 30s adb -s "$ANDROID_SERIAL" shell env CLASSPATH=/data/local/tmp/ashnazg-display-probe.jar /system/bin/app_process /system/bin com.ashnazg.displayprobe.DisplayProbe --inspect | tee artifacts/hwc/policy-inspect.txt
            timeout 60s adb -s "$ANDROID_SERIAL" shell env CLASSPATH=/data/local/tmp/ashnazg-display-probe.jar /system/bin/app_process /system/bin com.ashnazg.displayprobe.DisplayProbe --qualify-modes --disposable-guest --timeout-ms 5000 | tee artifacts/hwc/policy-qualification.txt
      - name: Clean up the owned Binderfs test fixture
        if: always()
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" python3 scripts/linux_binder.py --output-dir artifacts/hwc --cleanup
      - name: Upload experimental HWC evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: experimental-hwc-qualification
          if-no-files-found: warn
          path: |
            artifacts/hwc/**
            target/release/ashnazg
            agent-android/agent/build/outputs/apk/debug/*.apk
            agent-android/fixture/build/outputs/apk/debug/*.apk
            fixtures/compose/build/outputs/apk/debug/*.apk
            fixtures/reactnative/build/outputs/apk/debug/*.apk

  hwc-gate:
    name: HWC quality gate
    if: always()
    needs: [scope, qualify]
    runs-on: ubuntu-latest
    steps:
      - name: Require the applicable HWC qualification
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          HWC_REQUIRED: ${{ needs.scope.outputs.required }}
          HWC_RESULT: ${{ needs.qualify.result }}
        run: |
          test "$SCOPE_RESULT" = success
          case "$HWC_REQUIRED" in
            true) test "$HWC_RESULT" = success ;;
            false) test "$HWC_RESULT" = skipped ;;
            *) echo 'Missing HWC qualification scope decision' >&2; exit 1 ;;
          esac
